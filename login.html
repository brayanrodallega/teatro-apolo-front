<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo.css">
    <title>Login</title>
</head>
<body>
    <section>
        <form id="LoginForm">
            <h2>Login</h2>
            <label for="ema">Correo</label>
            <input type="email" placeholder="Escriba su correo" name="email" id="email" autofocus required>
            <label for="pas">Contraseña</label>
            <input type="password" id="password" placeholder="Escriba su contraseña" required>
            <input type="submit" value="Iniciar sesion">
        </form>
        <p>¿no tienes cuenta? <a href="signin.html">Registrar</a></p> 
    </section>
    <script src="/js/login.js"></script>
</body>
</html>
