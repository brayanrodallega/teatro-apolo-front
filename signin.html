<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo.css">
    <title>Sign in</title>
</head>
<body>
    <section>
        <form id="signinForm">
            <h2>Sign in</h2>
            <label for="usu">Usuario</label>
            <input type="text" placeholder="Escriba un usuario" id="user" autofocus required>
            <label for="ema">Correo</label>
            <input type="email" placeholder="Escriba su correo" name="email" id="email" required>
            <label for="pas">Contraseña</label>
            <input type="password" id="password" placeholder="Escriba su contraseña" required>
            <input type="submit" value="Registrar">
        </form>
        <p>¿ya tienes cuenta? <a href="login.html">Iniciar sesion</a></p>
    </section>
    <script src="/js/signin.js"></script>
</body>
</html>
